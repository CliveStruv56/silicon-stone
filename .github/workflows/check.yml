name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:security
      - run: npm run test:style-rules
      # Fails when docs/operator-manual.md drifts from the code it documents.
      # Four guides went stale and contradicted each other before this existed.
      - run: npm run test:manual
      - run: npm run test:knowledge-inbox
      - run: npm run test:evidence-index
      # The separation guard: the Compliance Checker's legal authority is the
      # pinned rule pack, never the editorial retrieval corpus. It also asserts
      # the chunker invariants for EVERY ingested instrument. Shipped 2026-08-13
      # but only ever run by hand until now — a guard nobody runs is a comment.
      - run: npm run test:regulatory-index
      # The three Sanity `product` documents hold the one price the code cannot
      # import, and the end-of-article gate renders it. Deliberately not in
      # `prebuild`: it needs the network, and a Sanity blip must not be able to
      # fail a Vercel deploy. SANITY_API_READ_TOKEN is optional — with it the
      # run also warns about drafts that would break on publish.
      - run: npm run test:sanity-prices
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: 3q59mpd7
          NEXT_PUBLIC_SANITY_DATASET: production
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      # The internal document types must stay invisible to an anonymous caller.
      # Type-level access control on the Sanity project is what enforces that,
      # it lives in a console rather than in this repository, and nothing would
      # otherwise say a word if it changed. Same reasoning as the check above
      # for not being in `prebuild`: it needs the network, and a Sanity blip
      # must not be able to fail a Vercel deploy. The token is optional but
      # turns "returned nothing" into "has documents and still returned
      # nothing", which is the difference between a check and a rubber stamp.
      - run: npm run test:dataset-access
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: 3q59mpd7
          NEXT_PUBLIC_SANITY_DATASET: production
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      # Catch server/client-boundary breakage that lint+typecheck miss —
      # otherwise it surfaces only as a failed Vercel deploy.
      - run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: 3q59mpd7
          NEXT_PUBLIC_SANITY_DATASET: production
      # PWA installability gate: manifest, service worker, offline fallback,
      # and icon assets must all be served (reuses the build above).
      - run: npm run test:pwa
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: 3q59mpd7
          NEXT_PUBLIC_SANITY_DATASET: production
